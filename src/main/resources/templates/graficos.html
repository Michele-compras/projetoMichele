<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Gráficos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<div class="main-content">
<div class="container-fluid p-4">

    <h2 class="mb-3">Gráficos</h2>

    <form method="get" action="/graficos" class="mb-4 d-flex align-items-end gap-2 no-print">
        <div>
            <label class="form-label mb-1">Filtrar coleções</label>
            <input type="text" name="colecaoFiltro" class="form-control" style="min-width:220px"
                   th:value="${colecaoFiltro}" placeholder="Ex: verão, inverno...">
        </div>
        <button type="submit" class="btn btn-primary">Filtrar</button>
        <a href="/graficos" class="btn btn-outline-secondary">Limpar</a>
    </form>

    <!-- ── Gráfico 1: Cotado x Aprovado por Coleção ──────────────────────────
         Dados do Quadro de Planejamento (soma das cinco marcas).
         Colunas agrupadas: duas medidas na mesma unidade, poucas coleções. -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <strong>Cotado x Aprovado por Coleção</strong>
            <span class="small text-white-50">Quadro de Planejamento</span>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(cotAprLabels)}" class="text-center text-muted py-4">
                Nenhuma coleção encontrada para este filtro.
            </div>

            <div th:if="${!#lists.isEmpty(cotAprLabels)}">
                <!-- Números de topo: o resumo que se lê antes do gráfico -->
                <div class="d-flex flex-wrap gap-4 mb-3">
                    <div>
                        <div class="text-uppercase text-muted" style="font-size:0.7rem; letter-spacing:0.08em;">Total cotado</div>
                        <div class="fw-bold" style="font-size:1.6rem; line-height:1.1;" th:text="${cotAprTotalCotado}">0</div>
                    </div>
                    <div>
                        <div class="text-uppercase text-muted" style="font-size:0.7rem; letter-spacing:0.08em;">Total aprovado</div>
                        <div class="fw-bold" style="font-size:1.6rem; line-height:1.1;" th:text="${cotAprTotalAprovado}">0</div>
                    </div>
                    <div>
                        <div class="text-uppercase text-muted" style="font-size:0.7rem; letter-spacing:0.08em;">Aproveitamento</div>
                        <div class="fw-bold" style="font-size:1.6rem; line-height:1.1;"
                             th:text="${cotAprTotalCotado > 0
                                 ? #numbers.formatDecimal(cotAprTotalAprovado * 100.0 / cotAprTotalCotado, 1, 'POINT', 1, 'COMMA') + '%'
                                 : '—'}">—</div>
                    </div>
                </div>

                <!-- A largura é limitada por JS conforme o nº de coleções: com poucas
                     coleções um canvas de largura total espalharia as colunas pela tela. -->
                <div id="wrapCotAprv" style="position:relative; height:340px;">
                    <canvas id="graficoCotAprv"></canvas>
                </div>

                <!-- Mesma informação em tabela: acessibilidade e conferência rápida. -->
                <details class="mt-3">
                    <summary class="small text-muted" style="cursor:pointer;">Ver os números em tabela</summary>
                    <div class="table-responsive mt-2">
                        <table class="table table-sm table-bordered mb-0" style="font-size:0.82rem; max-width:520px;">
                            <thead class="table-light">
                                <tr>
                                    <th>Coleção</th>
                                    <th class="text-end">Cotado</th>
                                    <th class="text-end">Aprovado</th>
                                    <th class="text-end">Aproveitamento</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="i : ${#numbers.sequence(0, cotAprLabels.size() - 1)}">
                                    <td th:text="${cotAprLabels[i]}"></td>
                                    <td class="text-end" th:text="${cotAprCotado[i]}"></td>
                                    <td class="text-end" th:text="${cotAprAprovado[i]}"></td>
                                    <td class="text-end" th:text="${cotAprCotado[i] > 0
                                        ? #numbers.formatDecimal(cotAprAprovado[i] * 100.0 / cotAprCotado[i], 1, 'POINT', 1, 'COMMA') + '%'
                                        : '—'}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <!-- Próximos gráficos entram como novos cards a partir daqui. -->

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
/*<![CDATA[*/
// Paleta validada para daltonismo (ΔE 26 protan) e contraste >= 3:1 sobre o card branco.
var COR_A     = '#3b7dd8';
var COR_B     = '#a8801f';
var INK       = '#495057';
var INK_MUTED = '#6c757d';
var GRID      = 'rgba(33, 37, 41, 0.08)';

// Escreve o valor acima de cada coluna. Evita ter que caçar o número no eixo
// e dispensa o plugin externo de datalabels.
var rotulosNoTopo = {
    id: 'rotulosNoTopo',
    afterDatasetsDraw: function (chart) {
        var ctx = chart.ctx;
        ctx.save();
        ctx.font = '600 11px system-ui, -apple-system, "Segoe UI", sans-serif';
        ctx.fillStyle = INK;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        chart.data.datasets.forEach(function (dataset, di) {
            var meta = chart.getDatasetMeta(di);
            if (meta.hidden) return;
            meta.data.forEach(function (barra, i) {
                var valor = dataset.data[i];
                if (valor === null || valor === undefined || valor === 0) return;
                ctx.fillText(valor, barra.x, barra.y - 4);
            });
        });
        ctx.restore();
    }
};

// Opções comuns a um gráfico de colunas agrupadas, para os próximos reaproveitarem.
function opcoesColunas(extras) {
    return {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 18 } },
        interaction: { mode: 'index', intersect: false },
        plugins: {
            legend: {
                position: 'top',
                align: 'end',
                labels: { color: INK, boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'rectRounded' }
            },
            tooltip: Object.assign({
                backgroundColor: 'rgba(33, 37, 41, 0.92)',
                padding: 10,
                displayColors: true
            }, (extras && extras.tooltip) || {})
        },
        scales: {
            x: {
                grid: { display: false },
                border: { color: GRID },
                ticks: { color: INK_MUTED, autoSkip: false, maxRotation: 30, minRotation: 0 }
            },
            y: {
                beginAtZero: true,
                grid: { color: GRID, drawTicks: false },
                border: { display: false },
                ticks: { color: INK_MUTED, precision: 0, padding: 8 }
            }
        }
    };
}

function estiloColuna(cor) {
    return {
        backgroundColor: cor,
        borderRadius: { topLeft: 4, topRight: 4 },
        borderSkipped: 'bottom',
        maxBarThickness: 64,
        categoryPercentage: 0.5,
        barPercentage: 0.88
    };
}

// ── Gráfico 1: Cotado x Aprovado por Coleção ──────────────────────────────
(function () {
    var canvas = document.getElementById('graficoCotAprv');
    if (!canvas || typeof Chart === 'undefined') return;

    var labels   = /*[[${cotAprLabels}]]*/ [];
    var cotado   = /*[[${cotAprCotado}]]*/ [];
    var aprovado = /*[[${cotAprAprovado}]]*/ [];

    // Sem isto, uma única coleção joga as duas colunas para cantos opostos da tela.
    var wrap = document.getElementById('wrapCotAprv');
    if (wrap) wrap.style.maxWidth = Math.max(380, 110 + labels.length * 230) + 'px';

    new Chart(canvas, {
        type: 'bar',
        plugins: [rotulosNoTopo],
        data: {
            labels: labels,
            datasets: [
                Object.assign({ label: 'Cotado',   data: cotado   }, estiloColuna(COR_A)),
                Object.assign({ label: 'Aprovado', data: aprovado }, estiloColuna(COR_B))
            ]
        },
        options: opcoesColunas({
            tooltip: {
                callbacks: {
                    // Mostra o aproveitamento junto: é a leitura que interessa.
                    afterBody: function (itens) {
                        var i = itens[0].dataIndex;
                        if (!cotado[i]) return '';
                        var pct = (aprovado[i] * 100 / cotado[i]).toFixed(1).replace('.', ',');
                        return 'Aproveitamento: ' + pct + '%';
                    }
                }
            }
        })
    });
})();
/*]]>*/
</script>
</body>
</html>
