<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Cadastro Prévio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<div class="main-content">
<div class="container-fluid p-4">
    <h2 class="mb-4">Cadastro Prévio</h2>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">

        <!-- MARCAS -->
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-header"><strong><i class="bi bi-tag"></i> Marcas</strong></div>
                <div class="card-body p-0">
                    <table class="table table-striped table-sm mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Nome</th>
                                <th class="text-center" style="width:60px">Excluir</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(marcas)}">
                                <td colspan="2" class="text-center text-muted py-2">Nenhuma marca cadastrada.</td>
                            </tr>
                            <tr th:each="m : ${marcas}">
                                <td th:text="${m.nome}"></td>
                                <td class="text-center">
                                    <form th:action="@{/cadastro-previo/marca/excluir/{id}(id=${m.id})}" method="post"
                                          onsubmit="return confirm('Excluir esta marca?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer">
                    <form th:action="@{/cadastro-previo/marca/salvar}" th:object="${novaMarca}" method="post" class="d-flex gap-2">
                        <input type="text" th:field="*{nome}" class="form-control form-control-sm" placeholder="Nova marca..." required>
                        <button type="submit" class="btn btn-sm btn-primary">Adicionar</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- COLEÇÕES -->
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-header"><strong><i class="bi bi-collection"></i> Coleções</strong></div>
                <div class="card-body p-0">
                    <table class="table table-striped table-sm mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Nome</th>
                                <th class="text-center" style="width:60px">Excluir</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(colecoes)}">
                                <td colspan="2" class="text-center text-muted py-2">Nenhuma coleção cadastrada.</td>
                            </tr>
                            <tr th:each="c : ${colecoes}">
                                <td th:text="${c.nome}"></td>
                                <td class="text-center">
                                    <form th:action="@{/cadastro-previo/colecao/excluir/{id}(id=${c.id})}" method="post"
                                          onsubmit="return confirm('Excluir esta coleção?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer">
                    <form th:action="@{/cadastro-previo/colecao/salvar}" th:object="${novaColecao}" method="post" class="d-flex gap-2">
                        <input type="text" th:field="*{nome}" class="form-control form-control-sm" placeholder="Nova coleção..." required>
                        <button type="submit" class="btn btn-sm btn-primary">Adicionar</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- INSUMOS -->
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-header"><strong><i class="bi bi-box"></i> Insumos</strong></div>
                <div class="card-body p-0">
                    <table class="table table-striped table-sm mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Nome</th>
                                <th class="text-center" style="width:60px">Excluir</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(insumos)}">
                                <td colspan="2" class="text-center text-muted py-2">Nenhum insumo cadastrado.</td>
                            </tr>
                            <tr th:each="i : ${insumos}">
                                <td th:text="${i.nome}"></td>
                                <td class="text-center">
                                    <form th:action="@{/cadastro-previo/insumo/excluir/{id}(id=${i.id})}" method="post"
                                          onsubmit="return confirm('Excluir este insumo?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer">
                    <form th:action="@{/cadastro-previo/insumo/salvar}" th:object="${novoInsumo}" method="post" class="d-flex gap-2">
                        <input type="text" th:field="*{nome}" class="form-control form-control-sm" placeholder="Novo insumo..." required>
                        <button type="submit" class="btn btn-sm btn-primary">Adicionar</button>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <div class="row">

        <!-- FORNECEDORES -->
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-header"><strong><i class="bi bi-truck"></i> Fornecedores</strong></div>
                <div class="card-body p-0">
                    <table class="table table-striped table-sm mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Nome</th>
                                <th class="text-center" style="width:60px">Excluir</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(fornecedores)}">
                                <td colspan="2" class="text-center text-muted py-2">Nenhum fornecedor cadastrado.</td>
                            </tr>
                            <tr th:each="f : ${fornecedores}">
                                <td th:text="${f.nome}"></td>
                                <td class="text-center">
                                    <form th:action="@{/cadastro-previo/fornecedor/excluir/{id}(id=${f.id})}" method="post"
                                          onsubmit="return confirm('Excluir este fornecedor?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer">
                    <form th:action="@{/cadastro-previo/fornecedor/salvar}" th:object="${novoFornecedor}" method="post" class="d-flex gap-2">
                        <input type="text" th:field="*{nome}" class="form-control form-control-sm" placeholder="Novo fornecedor..." required>
                        <button type="submit" class="btn btn-sm btn-primary">Adicionar</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- CATEGORIAS -->
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-header"><strong><i class="bi bi-bookmark"></i> Categorias</strong></div>
                <div class="card-body p-0">
                    <table class="table table-striped table-sm mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Nome</th>
                                <th class="text-center" style="width:60px">Excluir</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(categorias)}">
                                <td colspan="2" class="text-center text-muted py-2">Nenhuma categoria cadastrada.</td>
                            </tr>
                            <tr th:each="cat : ${categorias}">
                                <td th:text="${cat.nome}"></td>
                                <td class="text-center">
                                    <form th:action="@{/cadastro-previo/categoria/excluir/{id}(id=${cat.id})}" method="post"
                                          onsubmit="return confirm('Excluir esta categoria?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer">
                    <form th:action="@{/cadastro-previo/categoria/salvar}" th:object="${novaCategoria}" method="post" class="d-flex gap-2">
                        <input type="text" th:field="*{nome}" class="form-control form-control-sm" placeholder="Nova categoria..." required>
                        <button type="submit" class="btn btn-sm btn-primary">Adicionar</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
