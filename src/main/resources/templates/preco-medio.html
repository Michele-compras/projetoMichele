<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Preço Médio por Categoria')}"></head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<div class="main-content">
<div class="container-fluid p-4">

    <h2 class="mb-3">Preço Médio por Categoria</h2>

    <!-- Filtros -->
    <div class="card border-0 shadow-sm mb-4 no-print">
        <div class="card-body">
            <form th:action="@{/preco-medio}" method="get">
                <div class="row g-2 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label">Coleção</label>
                        <select class="form-select form-select-sm" name="colecao">
                            <option value="">Todas</option>
                            <option th:each="c : ${colecoes}" th:value="${c}" th:text="${c}"
                                    th:selected="${colecaoSel != null and colecaoSel == c}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Fornecedor</label>
                        <select class="form-select form-select-sm" name="fornecedor">
                            <option value="">Todos</option>
                            <option th:each="f : ${fornecedores}" th:value="${f}" th:text="${f}"
                                    th:selected="${fornecedorSel != null and fornecedorSel == f}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary btn-sm w-100">
                            <i class="bi bi-search me-1"></i> Filtrar
                        </button>
                    </div>
                    <div class="col-md-2">
                        <a th:href="@{/preco-medio}" class="btn btn-outline-secondary btn-sm w-100">
                            <i class="bi bi-x-circle me-1"></i> Limpar
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Quadro -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <strong>Preço Médio por Categoria e Marca</strong>
            <span class="badge bg-secondary" th:text="${totalFichas} + ' fichas'"></span>
        </div>
        <div class="card-body p-0">

            <div th:if="${#lists.isEmpty(linhas)}" class="text-center py-5 text-muted">
                <i class="bi bi-inbox" style="font-size:3rem"></i>
                <p class="mt-3">Nenhum resultado encontrado para os filtros selecionados.</p>
            </div>

            <div th:if="${!#lists.isEmpty(linhas)}" class="table-responsive">
                <table class="table table-sm table-bordered table-hover mb-0" style="font-size:0.85rem;">
                    <thead class="table-secondary">
                        <tr>
                            <th class="ps-3">Categoria</th>
                            <th>Marca</th>
                            <th class="text-center" style="width:60px">Qtd</th>
                            <th class="text-end" style="width:160px">Preço Médio USD</th>
                            <th class="text-end" style="width:160px">Preço Médio R$</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="linha : ${linhas}">
                            <td class="ps-3 fw-bold" th:text="${linha.categoria}"></td>
                            <td th:text="${linha.marca}"></td>
                            <td class="text-center text-muted" th:text="${linha.qtd}"></td>
                            <td class="text-end text-primary fw-bold">
                                <span th:if="${linha.mediaUsd != null}"
                                      th:text="'$ ' + ${#numbers.formatDecimal(linha.mediaUsd, 1, 'POINT', 2, 'COMMA')}"></span>
                                <span th:if="${linha.mediaUsd == null}" class="text-muted">—</span>
                            </td>
                            <td class="text-end text-success fw-bold">
                                <span th:if="${linha.mediaReais != null}"
                                      th:text="'R$ ' + ${#numbers.formatDecimal(linha.mediaReais, 1, 'POINT', 2, 'COMMA')}"></span>
                                <span th:if="${linha.mediaReais == null}" class="text-muted">—</span>
                            </td>
                        </tr>
                    </tbody>
                    <tfoot class="table-secondary fw-bold">
                        <tr>
                            <td class="ps-3" colspan="2">MÉDIA GERAL</td>
                            <td class="text-center" th:text="${totalFichas}"></td>
                            <td class="text-end text-primary">
                                <span th:if="${totalMediaUsd != null}"
                                      th:text="'$ ' + ${#numbers.formatDecimal(totalMediaUsd, 1, 'POINT', 2, 'COMMA')}"></span>
                                <span th:if="${totalMediaUsd == null}" class="text-muted">—</span>
                            </td>
                            <td class="text-end text-success">
                                <span th:if="${totalMediaReais != null}"
                                      th:text="'R$ ' + ${#numbers.formatDecimal(totalMediaReais, 1, 'POINT', 2, 'COMMA')}"></span>
                                <span th:if="${totalMediaReais == null}" class="text-muted">—</span>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
