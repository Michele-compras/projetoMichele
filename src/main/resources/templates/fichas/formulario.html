<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Ficha Técnica')}"></head>
<body>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<div class="main-content">
<div class="container-fluid p-4">
    <h2 th:text="${ficha.id != null ? 'Editar Ficha Técnica' : 'Nova Ficha Técnica'}"></h2>

    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/fichas/salvar}" th:object="${ficha}" method="post">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{fotoPath}">
        <!-- Filtros da listagem: trafegam junto para voltar à lista filtrada após salvar -->
        <input type="hidden" name="fColecao"  th:value="${fColecao}">
        <input type="hidden" name="fTipo"     th:value="${fTipo}">
        <input type="hidden" name="fStatus"   th:value="${fStatus}">
        <input type="hidden" name="fCodigo"   th:value="${fCodigo}">
        <input type="hidden" name="fDuimp"    th:value="${fDuimp}">
        <input type="hidden" name="fContrato" th:value="${fContrato}">

        <!-- Informações Gerais -->
        <div class="card mb-3">
            <div class="card-header"><strong>Informações Gerais</strong></div>
            <div class="card-body">
                <div class="row mb-2">
                    <div class="col-md-2">
                        <label for="tipoSolicitacao" class="form-label">Tipo Solicitação</label>
                        <select id="tipoSolicitacao" class="form-select" th:field="*{tipoSolicitacao}">
                            <option value="">Selecione...</option>
                            <option value="Nova">Nova</option>
                            <option value="Repeat">Repeat</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="tipo" class="form-label">Insumo *</label>
                        <select id="tipo" class="form-select" th:field="*{tipo}" required>
                            <option value="">Selecione...</option>
                            <option th:each="i : ${insumosCadastrados}" th:value="${i.nome}" th:text="${i.nome}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="fornecedor" class="form-label">Fornecedor</label>
                        <select id="fornecedor" class="form-select" th:field="*{fornecedor}">
                            <option value="">Selecione...</option>
                            <option th:each="f : ${fornecedoresCadastrados}"
                                    th:value="${f.nome}"
                                    th:text="${f.nome}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="refFornecedor" class="form-label">Ref. Fornecedor</label>
                        <input type="text" id="refFornecedor" class="form-control" th:field="*{refFornecedor}">
                    </div>
                    <div class="col-md-3">
                        <label for="refTexcotton" class="form-label">Código Texcotton</label>
                        <input type="text" id="refTexcotton" class="form-control" th:field="*{refTexcotton}">
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col-md-2">
                        <label for="categoriaProduto" class="form-label">Categoria</label>
                        <select id="categoriaProduto" class="form-select" th:field="*{categoriaProduto}">
                            <option value="">Selecione...</option>
                            <option th:each="cat : ${categoriasCadastradas}"
                                    th:value="${cat.nome}"
                                    th:text="${cat.nome}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="cor" class="form-label">Cor *</label>
                        <input type="text" id="cor" class="form-control" th:field="*{cor}" required>
                    </div>
                    <div class="col-md-2">
                        <label for="marca" class="form-label">Marca solicitante</label>
                        <select id="marca" class="form-select" th:field="*{marca}">
                            <option value="">Selecione...</option>
                            <option th:each="m : ${marcasCadastradas}" th:value="${m.nome}" th:text="${m.nome}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="marcaQueUtiliza" class="form-label">Marca que Utiliza</label>
                        <select id="marcaQueUtiliza" class="form-select" th:field="*{marcaQueUtiliza}">
                            <option value="">Selecione...</option>
                            <option th:each="m : ${marcasCadastradas}" th:value="${m.nome}" th:text="${m.nome}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="composicao" class="form-label">Composição detalhada</label>
                        <input type="text" id="composicao" class="form-control" th:field="*{composicao}">
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col-md-2 campo-gramatura">
                        <label for="gramatura" class="form-label">Gramatura(G/M2)</label>
                        <input type="text" id="gramatura" class="form-control" th:field="*{gramatura}">
                    </div>
                    <div class="col-md-2">
                        <label for="largura" class="form-label">Largura(MT)</label>
                        <input type="text" id="largura" class="form-control" th:field="*{largura}">
                    </div>
                    <div class="col-md-2">
                        <label for="rendimento" class="form-label">Rendimento</label>
                        <input type="text" id="rendimento" class="form-control" th:field="*{rendimento}">
                    </div>
                    <div class="col-md-2">
                        <label for="unidadeMedida" class="form-label">Unidade de Medida</label>
                        <select id="unidadeMedida" class="form-select" th:field="*{unidadeMedida}">
                            <option value="">Selecione...</option>
                            <option value="Metro">Metro</option>
                            <option value="Quilo">Quilo</option>
                            <option value="Unidade">Unidade</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="qtiPct" class="form-label">Qti pct</label>
                        <input type="text" id="qtiPct" class="form-control" th:field="*{qtiPct}">
                    </div>
                    <div class="col-md-2">
                        <label for="colecao" class="form-label">Coleção</label>
                        <select id="colecao" class="form-select" th:field="*{colecao}">
                            <option value="">Selecione...</option>
                            <option th:each="c : ${colecoesCadastradas}" th:value="${c.nome}" th:text="${c.nome}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="ncm" class="form-label">NCM</label>
                        <input type="text" id="ncm" class="form-control" th:field="*{ncm}">
                    </div>
                    <div class="col-md-3">
                        <label for="codigoSiscomex" class="form-label">Código SISCOMEX</label>
                        <input type="text" id="codigoSiscomex" class="form-control" th:field="*{codigoSiscomex}">
                    </div>
                </div>
            </div>
        </div>

        <!-- Pedido e Preços -->
        <div class="card mb-3">
            <div class="card-header"><strong>Dados do Pedido</strong></div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label for="numeroPedido" class="form-label">Nº Pedido</label>
                        <input type="text" id="numeroPedido" class="form-control" th:field="*{numeroPedido}">
                    </div>
                    <div class="col-md-3">
                        <label for="dataColocacaoPedido" class="form-label">Data Colocação</label>
                        <input type="date" id="dataColocacaoPedido" class="form-control" th:field="*{dataColocacaoPedido}">
                    </div>
                    <div class="col-md-3">
                        <label for="statusPedido" class="form-label">Status do Pedido</label>
                        <select id="statusPedido" class="form-select" th:field="*{statusPedido}">
                            <option th:each="s : ${statusPedidoList}" th:value="${s}" th:text="${s.descricao}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="minimoCompraDisplay" class="form-label">Mínimo de Compra</label>
                        <input type="text" id="minimoCompraDisplay" class="form-control"
                               th:value="${ficha.minimoCompra != null ? #numbers.formatDecimal(ficha.minimoCompra, 1, 'POINT', 2, 'COMMA') : ''}"
                               oninput="formatarMilhares(this)" autocomplete="off" placeholder="1.000,00">
                        <input type="hidden" id="minimoCompra" name="minimoCompra" th:value="${ficha.minimoCompra}">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label for="quantidadeCompradaDisplay" class="form-label">Quantidade Comprada</label>
                        <input type="text" id="quantidadeCompradaDisplay" class="form-control"
                               th:value="${ficha.quantidadeComprada != null ? #numbers.formatDecimal(ficha.quantidadeComprada, 1, 'POINT', 2, 'COMMA') : ''}"
                               oninput="formatarMilhares(this)" autocomplete="off" placeholder="1.000,00">
                        <input type="hidden" id="quantidadeComprada" name="quantidadeComprada" th:value="${ficha.quantidadeComprada}">
                    </div>
                    <div class="col-md-3">
                        <label for="precoUsd" class="form-label">Preço USD</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.0001" id="precoUsd" class="form-control" th:field="*{precoUsd}">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label for="precoReais" class="form-label">Preço R$</label>
                        <div class="input-group">
                            <span class="input-group-text">R$</span>
                            <input type="number" step="0.01" id="precoReais" class="form-control" th:field="*{precoReais}">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Embarque -->
        <div class="card mb-3">
            <div class="card-header"><strong>Dados de Embarque</strong></div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="nomeNavio" class="form-label">Nome do Navio</label>
                        <input type="text" id="nomeNavio" class="form-control" th:field="*{nomeNavio}">
                    </div>
                    <div class="col-md-4">
                        <label for="dataSaidaOrigem" class="form-label">Data Saída Origem</label>
                        <input type="date" id="dataSaidaOrigem" class="form-control" th:field="*{dataSaidaOrigem}">
                    </div>
                    <div class="col-md-4">
                        <label for="dataChegadaDestino" class="form-label">Data Chegada Destino</label>
                        <input type="date" id="dataChegadaDestino" class="form-control" th:field="*{dataChegadaDestino}">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="duimpDi" class="form-label">DUIMP/DI - Protocolo</label>
                        <input type="text" id="duimpDi" class="form-control" th:field="*{duimpDi}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Contrato de Câmbio</label>
                        <div class="row g-1">
                            <div class="col-6">
                                <label for="contratoCambioAdiant" class="form-label form-label-sm text-muted mb-0">Adiant. 30%</label>
                                <input type="text" id="contratoCambioAdiant" class="form-control form-control-sm" th:field="*{contratoCambioAdiant}">
                            </div>
                            <div class="col-6">
                                <label for="contratoCambioPgtoFinal" class="form-label form-label-sm text-muted mb-0">Pgto Final</label>
                                <input type="text" id="contratoCambioPgtoFinal" class="form-control form-control-sm" th:field="*{contratoCambioPgtoFinal}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Amostra de Cor -->
        <div class="card mb-3">
            <div class="card-header"><strong>Amostra de Cor</strong></div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="statusAmostraCor" class="form-label">Status</label>
                        <select id="statusAmostraCor" class="form-select" th:field="*{statusAmostraCor}">
                            <option th:each="s : ${statusList}" th:value="${s}" th:text="${s.descricao}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="dataAmostraCor" class="form-label">Data Recebimento</label>
                        <input type="date" id="dataAmostraCor" class="form-control" th:field="*{dataAmostraCor}">
                    </div>
                    <div class="col-md-4">
                        <label for="dataAprovacaoAmostraCor" class="form-label">Data Aprovação</label>
                        <input type="date" id="dataAprovacaoAmostraCor" class="form-control" th:field="*{dataAprovacaoAmostraCor}">
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <label for="observacaoAmostraCor" class="form-label">Observação</label>
                        <textarea id="observacaoAmostraCor" class="form-control" rows="2" th:field="*{observacaoAmostraCor}"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- Amostra de Produção -->
        <div class="card mb-3">
            <div class="card-header"><strong>Amostra de Produção</strong></div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="statusAmostraProducao" class="form-label">Status</label>
                        <select id="statusAmostraProducao" class="form-select" th:field="*{statusAmostraProducao}">
                            <option th:each="s : ${statusList}" th:value="${s}" th:text="${s.descricao}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="dataAmostraProducao" class="form-label">Data Recebimento</label>
                        <input type="date" id="dataAmostraProducao" class="form-control" th:field="*{dataAmostraProducao}">
                    </div>
                    <div class="col-md-4">
                        <label for="dataAprovacaoAmostraProducao" class="form-label">Data Aprovação</label>
                        <input type="date" id="dataAprovacaoAmostraProducao" class="form-control" th:field="*{dataAprovacaoAmostraProducao}">
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <label for="observacaoAmostraProducao" class="form-label">Observação</label>
                        <textarea id="observacaoAmostraProducao" class="form-control" rows="2" th:field="*{observacaoAmostraProducao}"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="'/fichas' + ${filtrosQuery} + ${ficha.id != null ? '#ficha-' + ficha.id : ''}"
               class="btn btn-secondary">Cancelar</a>
        </div>
    </form>

    <!-- Foto: form separado para evitar limite de multipart -->
    <div class="card mb-3" th:if="${ficha.id != null}">
        <div class="card-header"><strong>Foto do Item</strong></div>
        <div class="card-body">
            <form th:action="@{/fichas/foto/{id}(id=${ficha.id})}" method="post" enctype="multipart/form-data">
                <div class="row align-items-end">
                    <div class="col-md-5">
                        <input type="file" name="foto" class="form-control" accept="image/*">
                        <small th:if="${ficha.fotoPath != null and !ficha.fotoPath.isEmpty()}" class="text-muted">
                            Foto atual: <span th:text="${ficha.fotoPath}"></span>
                        </small>
                    </div>
                    <div class="col-md-auto">
                        <button type="submit" class="btn btn-outline-primary">Enviar Foto</button>
                    </div>
                </div>
            </form>
            <p th:if="${ficha.id == null}" class="text-muted small mt-1">Salve a ficha primeiro para poder adicionar foto.</p>
        </div>
    </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function formatarMilhares(input) {
    let val = input.value.replace(/\./g, '').replace(/[^\d,]/g, '');
    let parts = val.split(',');
    let intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    input.value = parts.length > 1 ? intPart + ',' + parts[1].substring(0, 2) : intPart;
    let hiddenId = input.id.replace('Display', '');
    let hidden = document.getElementById(hiddenId);
    if (hidden) hidden.value = input.value.replace(/\./g, '').replace(',', '.');
}

document.querySelector('form[action*="salvar"]').addEventListener('submit', function() {
    ['minimoCompra', 'quantidadeComprada'].forEach(function(field) {
        let display = document.getElementById(field + 'Display');
        let hidden = document.getElementById(field);
        if (display && hidden && display.value) {
            hidden.value = display.value.replace(/\./g, '').replace(',', '.');
        }
    });
});
</script>
</body>
</html>
