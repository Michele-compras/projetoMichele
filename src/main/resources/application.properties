spring.application.name=projeto

# H2 Database (file-based)
# Caminho ABSOLUTO e fixo: garante que IntelliJ e linha de comando usem SEMPRE o mesmo banco,
# independente do diretório de onde o app é iniciado. (Antes era relativo "./data" e abria
# bancos diferentes conforme o working directory, fazendo os dados "sumirem".)
# OBS: se a pasta do projeto for movida/renomeada, atualize este caminho.
spring.datasource.url=jdbc:h2:file:C:/Users/sabrina.00858/IdeaProjects/projetoMichele/data/fichatecnica;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# Date format
spring.mvc.format.date=yyyy-MM-dd

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1
server.tomcat.max-parameter-count=10000
# Caminho ABSOLUTO (mesma lógica do banco e dos backups): antes era relativo "uploads",
# então IntelliJ e linha de comando gravavam em pastas diferentes e parte das fotos
# ficava fora da pasta servida pelo app (imagem cadastrada na ficha, mas link quebrado).
app.upload.dir=C:/Users/sabrina.00858/IdeaProjects/projetoMichele/uploads

# Backup automático em CSV (camada extra de segurança; o banco continua a fonte principal)
# Caminho ABSOLUTO para não depender do diretório de execução (mesma lógica do banco).
# OBS: se a pasta do projeto for movida/renomeada, atualize este caminho.
app.backup.dir=C:/Users/sabrina.00858/IdeaProjects/projetoMichele/backups
# Intervalo do backup automático em milissegundos (300000 = 5 minutos)
app.backup.intervalo-ms=300000

server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=always
